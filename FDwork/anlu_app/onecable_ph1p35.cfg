# Use the local FTDI adapter with the PH1P35 PAD JTAG chain:
# CPU IR=5, FPGA configuration IR=8.  Keep remote debug and QSPI0
# enabled while attaching to the generated MCU IP.  Bit 7 remains 0
# so the local PLJTAG chain (CPU + FPGA cfg tap) is retained.
set INIT_PARM 0x104
echo "PH1P35 LOCAL CONFIG: [info script]; INIT_PARM=$INIT_PARM"
# Resolve the MCU IR=8 chain config.
# NOTE: this OpenOCD build does not implement "file normalize", and
# [info script] can resolve to a bare relative name, which made the original
# [file dirname [info script]] expand to "." and fail.  Try the known absolute
# path first and only fall back to the script-relative form.
set _mcu_cfg "C:/Users/21397/Desktop/fpga1/sc500cs/FDwork/anlu_app/ph1p35_mcu_ir8.cfg"
if {![file exists $_mcu_cfg]} {
    set _mcu_cfg [file join [file dirname [info script]] ph1p35_mcu_ir8.cfg]
}
echo "PH1P35 MCU CFG: $_mcu_cfg"
source $_mcu_cfg

# TD ChipWatcher connects to this OpenOCD RBB server, not to a VPI hwserver.
# Not every OpenOCD build provides the 'rbb' command; only TD ChipWatcher needs
# it, so skip it when unavailable instead of aborting the whole script.
if {[catch {rbb server start 5555} _rbb_err]} {
    echo "RBB server unavailable ($_rbb_err); continuing without it"
}

