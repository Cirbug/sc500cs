# PH1P35 camera_network.bit uses the PAD CPU+FPGA chain.
# FD 2026.2 currently supplies INIT_PARM=0x80 for Use Jtag Boot;
# override it to the verified target configuration (CPU IR=5, cfg IR=8).
set INIT_PARM 0x104
# The old saved USB location 3-1 does not match this host.
adapter usb location 1-13
source [file join [file dirname [info script]] ph1p35_mcu_ir8.cfg]
