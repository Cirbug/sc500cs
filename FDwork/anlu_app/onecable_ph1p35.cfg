# FD 2026.1 may inject INIT_PARM=0x280 from saved cable settings.
# Override it before loading the target: local FTDI, PLJTAG with two TAPs.
set INIT_PARM 0x000
source [find target/anlogic/ph1p35.cfg]

# TD ChipWatcher connects to this OpenOCD RBB server, not to a VPI hwserver.
rbb server start 5555
