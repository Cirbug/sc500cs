# Use the local FTDI adapter with the PH1P35 PAD JTAG chain:
# CPU IR=5, FPGA configuration IR=8.  Keep remote debug and QSPI0
# enabled while attaching to the generated MCU IP.  Bit 7 remains 0
# so the local PLJTAG chain (CPU + FPGA cfg tap) is retained.
set INIT_PARM 0x104
echo "PH1P35 LOCAL CONFIG: [info script]; INIT_PARM=$INIT_PARM"
source [file join [file dirname [info script]] ph1p35_mcu_ir8.cfg]

# TD ChipWatcher connects to this OpenOCD RBB server, not to a VPI hwserver.
rbb server start 5555

